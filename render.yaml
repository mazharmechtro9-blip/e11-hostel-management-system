# Browser-based demo deployment. No local Python, Node or Docker installation.
# Select only the free preview resources shown by Render; do not enter real
# resident or financial data into this development deployment.
services:
  - type: web
    name: e11-hostel-portal
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./infrastructure/Dockerfile.hosted
    healthCheckPath: /api/v1/public/rooms
    envVars:
      - key: APP_ENV
        value: development
      - key: DEMO_SEED
        value: "true"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: DEMO_PASSWORD
        sync: false
      - key: MFA_ENCRYPTION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: e11-hostel-db
          property: connectionString
databases:
  - name: e11-hostel-db
    plan: free
    region: oregon
    databaseName: e11
    user: e11
    ipAllowList: []
