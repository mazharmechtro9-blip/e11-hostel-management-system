name: Quality and security
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: e11
          POSTGRES_PASSWORD: e11_ci_password
          POSTGRES_DB: e11_test
        ports: ['5432:5432']
        options: --health-cmd 'pg_isready -U e11 -d e11_test' --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://e11:e11_ci_password@127.0.0.1:5432/e11_test
      APP_ENV: development
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r requirements.lock
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: mypy app --ignore-missing-imports --follow-imports=silent
      - run: pytest -q
      - run: pip install pip-audit && pip-audit -r requirements.lock
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm audit --audit-level=high
      - run: npm run build
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/configure-dev.py
      - run: docker compose up -d --wait db redis
      - run: pip install -r backend/requirements.lock
      - run: npm ci && npm --prefix frontend ci
      - run: npm run typecheck:e2e
      - run: npx playwright install --with-deps chromium
      - name: Prepare and start API
        working-directory: backend
        run: |
          alembic upgrade head
          python -m app.scripts.seed_demo
          uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/e11-backend.log 2>&1 &
      - name: Start frontend
        run: npm --prefix frontend run dev > /tmp/e11-frontend.log 2>&1 &
      - name: Wait for applications
        run: |
          curl --fail --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/health
          curl --fail --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:3000 > /dev/null
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            test-results/
            playwright-report/
            /tmp/e11-backend.log
            /tmp/e11-frontend.log
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
